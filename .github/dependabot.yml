version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    major:
      patterns:
      - '*'
      update-types:
      - major
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: nuget
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    major:
      patterns:
      - '*'
      update-types:
      - major
    security:
      applies-to: security-updates
      patterns:
      - '*'
  directories:
  - /src
  - /examples
