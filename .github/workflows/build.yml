name: Build and Test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    steps:
      - uses: MrKWatkins/build/dotnet/project@main
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: MrKWatkins/build/dotnet/project@main
        with:
          directory: examples
          docs: false
          coverage-assembly-filters: -MrKWatkins.Ast
