name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version without v; blank increments the latest stable tag minor version
        type: string
        required: false
      publish-packages:
        description: Publish NuGet packages and create a release
        type: boolean
        default: true
      publish-docs:
        description: Publish documentation
        type: boolean
        default: true
      api-ref:
        description: Optional API source override for docs-only XML comment corrections
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: MrKWatkins/build/dotnet/project@main
        with:
          directory: examples
          docs: false
          coverage-assembly-filters: -MrKWatkins.Ast
  release:
    name: Release
    needs: examples
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: MrKWatkins/build/dotnet/project@main
        with:
          version: ${{ inputs.version }}
          publish-packages: ${{ inputs.publish-packages }}
          publish-docs: ${{ inputs.publish-docs }}
          api-ref: ${{ inputs.api-ref }}
